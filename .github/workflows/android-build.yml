name: Build TaskFlow Lite APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-key: ${{ secrets.ANDROID_SDK_LICENSE_KEY }}
          
      - name: Install Build Tools
        run: |
          cd /usr/local/lib/android/sdk
          yes | cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
          yes | cmdline-tools/latest/bin/sdkmanager "platforms;android-34"
          
      - name: Install Gradle 8.4
        run: |
          cd ~
          curl -sL "https://services.gradle.org/distributions/gradle-8.4-all.zip" -o gradle-8.4-all.zip
          unzip -o gradle-8.4-all.zip -d /opt/gradle
          export PATH="/opt/gradle/gradle-8.4/bin:$PATH"
          gradle --version
          
      - name: Grant execute permission for Gradle
        run: chmod +x /opt/gradle/gradle-8.4/bin/gradle
        
      - name: Build with Gradle
        run: gradle assembleDebug
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
